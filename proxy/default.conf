server {
    listen 80;
    server_name localhost;

    # Маршрутизация на клиентскую часть (frontend)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Маршрутизация на микросервис туров
    location /api/tours {
        proxy_pass http://backend-tours:5001/api/tours;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Маршрутизация на микросервис бронирования
    location /api/booking {
        proxy_pass http://backend-booking:5002/api/booking;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}