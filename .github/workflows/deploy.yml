name: CI/CD Tourism Platform

on:
  push:
    branches:
      - main

jobs:
  # ЭТАП 1: сборка всей системы, запуск и тестирование
  test:
    name: Сборка и тестирование
    runs-on: ubuntu-latest

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Сборка и запуск контейнеров
        run: docker compose up -d --build

      - name: Проверка контейнера db-init
        run: |
          code=$(docker wait $(docker compose ps -aq db-init))
          echo "Код завершения db-init: $code"
          test "$code" = "0"

      - name: Ожидание готовности сайта
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost/api/tours > /dev/null; then
              echo "Сайт доступен"
              exit 0
            fi
            sleep 2
          done
          echo "Сайт не запустился за отведённое время"
          exit 1

      - name: Тестирование клиентской части
        run: |
          curl -f http://localhost/
          curl -f http://localhost/tours.html
          curl -f http://localhost/booking.html

      - name: Тестирование микросервиса туров
        run: |
          curl -fs http://localhost/api/tours | grep -q '"title"'
          curl -fs "http://localhost/api/tours?search=%D0%A0%D0%B8%D0%BC" | grep -q '"id"'

      - name: Тестирование микросервиса бронирования
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost/api/booking \
            -H "Content-Type: application/json" \
            -d '{"tour_id":1,"user_name":"CI Test","phone":"+70000000000","travel_date":"2026-12-01","guests_count":2}')
          echo "Корректная заявка, код ответа: $status"
          test "$status" = "201"

          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost/api/booking \
            -H "Content-Type: application/json" \
            -d '{"user_name":"CI Test"}')
          echo "Некорректная заявка, код ответа: $status"
          test "$status" = "400"

      - name: Вывод логов при ошибке
        if: failure()
        run: docker compose logs

      - name: Остановка и удаление контейнеров
        if: always()
        run: docker compose down --volumes

  # ЭТАП 2: публикация образов (только если тесты пройдены)
  publish:
    name: Публикация образов в Docker Hub
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service: [frontend, backend-tours, backend-booking, proxy, db-init]

    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD}}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tourism-${{ matrix.service }}:latest
